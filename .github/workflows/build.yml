name: Build APK

# Roda toda vez que você enviar (push) código para o repositório,
# e também pode ser disparado manualmente pela aba "Actions" no GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: MeuCaixa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
